<body>

  <script>
    //addition operator +
    let num = 3+5;
    console.log(num);
    num++;
    console.log(num++);

    //subtraction operator -
    let num1 = 5;
    let num2 = 4;
    console.log(num1-num2);

    //multiplication operator *
    let multi = 5*5;
    console.log(multi);

    //division operator /
    let div = 10/2;
    console.log(div);

  //remainder operator %
  let rem = 10%3;
  console.log(rem);

  //exponent operator **
  let exp = 12 ** 5;
  console.log(exp);
  </script>
  
</body>
