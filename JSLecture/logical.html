<body>
  <script>
   //logical operators
   //OR operator
   let num1=10;
   let num2=20;
   let num3=30;

   console.log(num1>num2 || num3>num2);

   //AND operator
   console.log(num1>num2 && num3>num2);

   //NOT operator
   console.log(!(num1==num2));

   console.log(!num1);
  </script>


</body>
</html>
