<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>

  <script>
    //true,false
    //greather than
    let a='10';
    let b=10;
    console.log(a>b);

    //greather than equal
    console.log(a>=b);

    //less than
    console.log(a<b);

    //less than equal
    console.log(a<=b);

    //double equal
    console.log(a==b);

    // //triple equal
    console.log(a===b);

    //not equal !=
    console.log(a!=b);  //false

    //not double equal
    console.log(a!==b); //true
  </script>
  
</body>
</html>
